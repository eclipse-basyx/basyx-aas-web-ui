services:
  db:
    image: postgres:18.4
    container_name: timeseries-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basyxTimeSeries
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d basyxTimeSeries"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  basyx-configuration:
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    pull_policy: always
    container_name: timeseries-basyx-configuration
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DBNAME: basyxTimeSeries
      POSTGRES_MAXOPENCONNECTIONS: 500
      POSTGRES_MAXIDLECONNECTIONS: 500
      POSTGRES_CONNMAXLIFETIMEMINUTES: 5
    depends_on:
      db:
        condition: service_healthy

  aas-env:
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    pull_policy: always
    container_name: timeseries-aas-env
    command: ["/app/aasenvironmentservice"]
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDCREDENTIALS: "true"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DBNAME: basyxTimeSeries
      POSTGRES_MAXOPENCONNECTIONS: 500
      POSTGRES_MAXIDLECONNECTIONS: 500
      POSTGRES_CONNMAXLIFETIMEMINUTES: 5
      ABAC_ENABLED: "false"
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_DISCOVERYINTEGRATION: "true"
      GENERAL_EXTERNALURL: http://localhost:8081
      GENERAL_AAS_PRECONFIG_PATHS: /app/preconfiguration/TimeSeriesDemo.aasx
    volumes:
      - ./aas:/app/preconfiguration:ro
    depends_on:
      basyx-configuration:
        condition: service_completed_successfully
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
      - "9999:9999"
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: influxpassword
      DOCKER_INFLUXDB_INIT_ORG: basyx
      DOCKER_INFLUXDB_INIT_BUCKET: basyx
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "S18VeAlq042B4naMX31oqIaSGmUmOLAC-DV3VIdkxDJuAhTXLTVFEchyTSmCcUAmB7Wu94KgExzV8gJaDjzR3Q=="
    restart: unless-stopped

  telegraf:
    image: telegraf:1.29.1
    container_name: telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    hostname: basyx_host
    depends_on:
      - influxdb
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.15
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -p 1883 -t 'topic' -C 1 -E -i probe -W 3"]
      interval: 5s
      timeout: 10s
      start_period: 1s
      retries: 3
    restart: unless-stopped

  mqtt-publisher:
    build: ./mqtt-publisher
    container_name: mqtt-publisher
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  aas-web-ui:
    image: eclipsebasyx/aas-gui:SNAPSHOT
    pull_policy: always
    container_name: aas-ui
    ports:
      - "3000:3000"
    volumes:
      - ./basyx-infra.yml:/basyx-infra.yml:ro
    environment:
      ENDPOINT_CONFIG_AVAILABLE: "true"
      INFLUXDB_TOKEN: "S18VeAlq042B4naMX31oqIaSGmUmOLAC-DV3VIdkxDJuAhTXLTVFEchyTSmCcUAmB7Wu94KgExzV8gJaDjzR3Q=="
    depends_on:
      aas-env:
        condition: service_healthy
    restart: unless-stopped
